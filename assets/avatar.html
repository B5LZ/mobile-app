UPNG.decode = function(buff)
{

	var dd = new Uint8Array(data.length), doff = 0;	 // put all IDAT data into it
	var fd, foff = 0;	// frames
	
	var mgck = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
	for(var i=0; i<8; i++) if(data[i]!=mgck[i]) throw "The input is not a PNG file!";

	while(offset<data.length)
	{
		var len  = bin.readUint(data, offset);  offset += 4;
		var type = bin.readASCII(data, offset, 4);  offset += 4;
		//log(type,len);
		
		if     (type=="IHDR")  {  UPNG.decode._IHDR(data, offset, out);  }
		else if(type=="IDAT") {
			for(var i=0; i<len; i++) dd[doff+i] = data[offset+i];
			doff += len;
		}
		else if(type=="acTL")  {
			out.tabs[type] = {  num_frames:rUi(data, offset), num_plays:rUi(data, offset+4)  };
			fd = new Uint8Array(data.length);
		}
		else if(type=="fcTL")  {
			if(foff!=0) {  var fr = out.frames[out.frames.length-1];
				fr.data = UPNG.decode._decompress(out, fd.slice(0,foff), fr.rect.width, fr.rect.height);  foff=0;
			}
			var rct = {x:rUi(data, offset+12),y:rUi(data, offset+16),width:rUi(data, offset+4),height:rUi(data, offset+8)};
			var del = rUs(data, offset+22);  del = rUs(data, offset+20) / (del==0?100:del);
			var frm = {rect:rct, delay:Math.round(del*1000), dispose:data[offset+24], blend:data[offset+25]};
			//console.log(frm);
			out.frames.push(frm);
		}
		else if(type=="fdAT") {
			for(var i=0; i<len-4; i++) fd[foff+i] = data[offset+i+4];
			foff += len-4;
		}
		else if(type=="pHYs") {
			out.tabs[type] = [bin.readUint(data, offset), bin.readUint(data, offset+4), data[offset+8]];
		}
		else if(type=="cHRM") {
			out.tabs[type] = [];
			for(var i=0; i<8; i++) out.tabs[type].push(bin.readUint(data, offset+i*4));
		}
		else if(type=="tEXt") {
			if(out.tabs[type]==null) out.tabs[type] = {};
			var nz = bin.nextZero(data, offset);
			var keyw = bin.readASCII(data, offset, nz-offset);
			var text = bin.readASCII(data, nz+1, offset+len-nz-1);
			out.tabs[type][keyw] = text;
		}
		else if(type=="iTXt") {
			if(out.tabs[type]==null) out.tabs[type] = {};
			var nz = 0, off = offset;
			nz = bin.nextZero(data, off);
			var keyw = bin.readASCII(data, off, nz-off);  off = nz + 1;
			var cflag = data[off], cmeth = data[off+1];  off+=2;
			nz = bin.nextZero(data, off);
			var ltag = bin.readASCII(data, off, nz-off);  off = nz + 1;
			nz = bin.nextZero(data, off);
			var tkeyw = bin.readUTF8(data, off, nz-off);  off = nz + 1;
			var text  = bin.readUTF8(data, off, len-(off-offset));
			out.tabs[type][keyw] = text;
		}
		else if(type=="PLTE") {
			out.tabs[type] = bin.readBytes(data, offset, len);
		}
		else if(type=="hIST") {
			var pl = out.tabs["PLTE"].length/3;
			out.tabs[type] = [];  for(var i=0; i<pl; i++) out.tabs[type].push(rUs(data, offset+i*2));
		}
		else if(type=="tRNS") {
			if     (out.ctype==3) out.tabs[type] = bin.readBytes(data, offset, len);
			else if(out.ctype==0) out.tabs[type] = rUs(data, offset);
			else if(out.ctype==2) out.tabs[type] = [ rUs(data,offset),rUs(data,offset+2),rUs(data,offset+4) ];
			//else console.log("tRNS for unsupported color type",out.ctype, len);
		}
		else if(type=="gAMA") out.tabs[type] = bin.readUint(data, offset)/100000;
		else if(type=="sRGB") out.tabs[type] = data[offset];
		else if(type=="bKGD")
		{
			if     (out.ctype==0 || out.ctype==4) out.tabs[type] = [rUs(data, offset)];
			else if(out.ctype==2 || out.ctype==6) out.tabs[type] = [rUs(data, offset), rUs(data, offset+2), rUs(data, offset+4)];
			else if(out.ctype==3) out.tabs[type] = data[offset];
		}
		else if(type=="IEND") {
			if(foff!=0) {  var fr = out.frames[out.frames.length-1];
				fr.data = UPNG.decode._decompress(out, fd.slice(0,foff), fr.rect.width, fr.rect.height);  foff=0;
			}	
			out.data = UPNG.decode._decompress(out, dd, out.width, out.height);  break;
		}
		//else {  log("unknown chunk type", type, len);  }
		offset += len;
		var crc = bin.readUint(data, offset);  offset += 4;
	}
	delete out.compress;  delete out.interlace;  delete out.filter;
	return out;
}

UPNG.decode._decompress = function(out, dd, w, h) {
	if(out.compress ==0) dd = UPNG.decode._inflate(dd);

	if     (out.interlace==0) dd = UPNG.decode._filterZero(dd, out, 0, w, h);
	else if(out.interlace==1) dd = UPNG.decode._readInterlace(dd, out);
	return dd;
}

UPNG.decode._inflate = function(data) {  return pako["inflate"](data);  }

UPNG.decode._readInterlace = function(data, out)
{
	var w = out.width, h = out.height;
	var bpp = UPNG.decode._getBPP(out), cbpp = bpp>>3, bpl = Math.ceil(w*bpp/8);
	var img = new Uint8Array( h * bpl );
	var di = 0;

	var starting_row  = [ 0, 0, 4, 0, 2, 0, 1 ];
	var starting_col  = [ 0, 4, 0, 2, 0, 1, 0 ];
	var row_increment = [ 8, 8, 8, 4, 4, 2, 2 ];
	var col_increment = [ 8, 8, 4, 4, 2, 2, 1 ];

	var pass=0;
	while(pass<7)
	{
		var ri = row_increment[pass], ci = col_increment[pass];
		var sw = 0, sh = 0;
		var cr = starting_row[pass];  while(cr<h) {  cr+=ri;  sh++;  }
		var cc = starting_col[pass];  while(cc<w) {  cc+=ci;  sw++;  }
		var bpll = Math.ceil(sw*bpp/8);
		UPNG.decode._filterZero(data, out, di, sw, sh);

		var y=0, row = starting_row[pass];
		while(row<h)
		{
			var col = starting_col[pass];
			var cdi = (di+y*bpll)<<3;

			while(col<w)
			{
				if(bpp==1) {
					var val = data[cdi>>3];  val = (val>>(7-(cdi&7)))&1;
					img[row*bpl + (col>>3)] |= (val << (7-((col&3)<<0)));
				}
				if(bpp==2) {
					var val = data[cdi>>3];  val = (val>>(6-(cdi&7)))&3;
					img[row*bpl + (col>>2)] |= (val << (6-((col&3)<<1)));
				}
				if(bpp==4) {
					var val = data[cdi>>3];  val = (val>>(4-(cdi&7)))&15;
					img[row*bpl + (col>>1)] |= (val << (4-((col&1)<<2)));
				}
				if(bpp>=8) {
					var ii = row*bpl+col*cbpp;
					for(var j=0; j<cbpp; j++) img[ii+j] = data[(cdi>>3)+j];
				}
				cdi+=bpp;  col+=ci;
			}
			y++;  row += ri;
		}
		if(sw*sh!=0) di += sh * (1 + bpll);
		pass = pass + 1;
	}
	return img;
}

UPNG.decode._getBPP = function(out) {
	var noc = [1,null,3,1,2,null,4][out.ctype];
	return noc * out.depth;
}

UPNG.decode._filterZero = function(data, out, off, w, h)
{
	var bpp = UPNG.decode._getBPP(out), bpl = Math.ceil(w*bpp/8), paeth = UPNG.decode._paeth;
	bpp = Math.ceil(bpp/8);

	for(var y=0; y<h; y++)  {
		var i = off+y*bpl, di = i+y+1;
		var type = data[di-1];

		if     (type==0) for(var x=  0; x<bpl; x++) data[i+x] = data[di+x];
		else if(type==1) {
			for(var x=  0; x<bpp; x++) data[i+x] = data[di+x];
			for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + data[i+x-bpp])&255;
		}
		else if(y==0) {
			for(var x=  0; x<bpp; x++) data[i+x] = data[di+x];
			if(type==2) for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x])&255;
			if(type==3) for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + (data[i+x-bpp]>>1) )&255;
			if(type==4) for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + paeth(data[i+x-bpp], 0, 0) )&255;
		}
		else {
			if(type==2) { for(var x=  0; x<bpl; x++) data[i+x] = (data[di+x] + data[i+x-bpl])&255;  }

			if(type==3) { for(var x=  0; x<bpp; x++) data[i+x] = (data[di+x] + (data[i+x-bpl]>>1))&255;
			              for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + ((data[i+x-bpl]+data[i+x-bpp])>>1) )&255;  }

			if(type==4) { for(var x=  0; x<bpp; x++) data[i+x] = (data[di+x] + paeth(0, data[i+x-bpl], 0))&255;
						  for(var x=bpp; x<bpl; x++) data[i+x] = (data[di+x] + paeth(data[i+x-bpp], data[i+x-bpl], data[i+x-bpp-bpl]) )&255;  }
		}
	}
	return data;
}

UPNG.decode._paeth = function(a,b,c)
{
	var p = a+b-c, pa = Math.abs(p-a), pb = Math.abs(p-b), pc = Math.abs(p-c);
	if (pa <= pb && pa <= pc)  return a;
	else if (pb <= pc)  return b;
	return c;
}

UPNG.decode._IHDR = function(data, offset, out)
{
	var bin = UPNG._bin;
	out.width  = bin.readUint(data, offset);  offset += 4;
	out.height = bin.readUint(data, offset);  offset += 4;
	out.depth     = data[offset];  offset++;
	out.ctype     = data[offset];  offset++;
	out.compress  = data[offset];  offset++;
	out.filter    = data[offset];  offset++;
	out.interlace = data[offset];  offset++;
}

UPNG._bin = {
	nextZero   : function(data,p)  {  while(data[p]!=0) p++;  return p;  },
	readUshort : function(buff,p)  {  return (buff[p]<< 8) | buff[p+1];  },
	writeUshort: function(buff,p,n){  buff[p] = (n>>8)&255;  buff[p+1] = n&255;  },
	readUint   : function(buff,p)  {  return (buff[p]*(256*256*256)) + ((buff[p+1]<<16) | (buff[p+2]<< 8) | buff[p+3]);  },
	writeUint  : function(buff,p,n){  buff[p]=(n>>24)&255;  buff[p+1]=(n>>16)&255;  buff[p+2]=(n>>8)&255;  buff[p+3]=n&255;  },
	readASCII  : function(buff,p,l){  var s = "";  for(var i=0; i<l; i++) s += String.fromCharCode(buff[p+i]);  return s;    },
	writeASCII : function(data,p,s){  for(var i=0; i<s.length; i++) data[p+i] = s.charCodeAt(i);  },
	readBytes  : function(buff,p,l){  var arr = [];   for(var i=0; i<l; i++) arr.push(buff[p+i]);   return arr;  },
	pad : function(n) { return n.length < 2 ? "0" + n : n; },
	readUTF8 : function(buff, p, l) {
		var s = "", ns;
		for(var i=0; i<l; i++) s += "%" + UPNG._bin.pad(buff[p+i].toString(16));
		try {  ns = decodeURIComponent(s); }
		catch(e) {  return UPNG._bin.readASCII(buff, p, l);  }
		return  ns;
	}
}
UPNG._copyTile = function(sb, sw, sh, tb, tw, th, xoff, yoff, mode)
{
	var w = Math.min(sw,tw), h = Math.min(sh,th);
	var si=0, ti=0;
	for(var y=0; y<h; y++)
		for(var x=0; x<w; x++)
		{
			if(xoff>=0 && yoff>=0) {  si = (y*sw+x)<<2;  ti = (( yoff+y)*tw+xoff+x)<<2;  }
			else                   {  si = ((-yoff+y)*sw-xoff+x)<<2;  ti = (y*tw+x)<<2;  }
			
			if     (mode==0) {  tb[ti] = sb[si];  tb[ti+1] = sb[si+1];  tb[ti+2] = sb[si+2];  tb[ti+3] = sb[si+3];  }
			else if(mode==1) {
				var fa = sb[si+3]*(1/255), fr=sb[si]*fa, fg=sb[si+1]*fa, fb=sb[si+2]*fa; 
				var ba = tb[ti+3]*(1/255), br=tb[ti]*ba, bg=tb[ti+1]*ba, bb=tb[ti+2]*ba; 
				
				var ifa=1-fa, oa = fa+ba*ifa, ioa = (oa==0?0:1/oa);
				tb[ti+3] = 255*oa;  
				tb[ti+0] = (fr+br*ifa)*ioa;  
				tb[ti+1] = (fg+bg*ifa)*ioa;   
				tb[ti+2] = (fb+bb*ifa)*ioa;  
			}
			else if(mode==2){	// copy only differences, otherwise zero
				var fa = sb[si+3], fr=sb[si], fg=sb[si+1], fb=sb[si+2]; 
				var ba = tb[ti+3], br=tb[ti], bg=tb[ti+1], bb=tb[ti+2]; 
				if(fa==ba && fr==br && fg==bg && fb==bb) {  tb[ti]=0;  tb[ti+1]=0;  tb[ti+2]=0;  tb[ti+3]=0;  }
				else {  tb[ti]=fr;  tb[ti+1]=fg;  tb[ti+2]=fb;  tb[ti+3]=fa;  }
			}
			else if(mode==3){	// check if can be blended
				var fa = sb[si+3], fr=sb[si], fg=sb[si+1], fb=sb[si+2]; 
				var ba = tb[ti+3], br=tb[ti], bg=tb[ti+1], bb=tb[ti+2]; 
				if(fa==ba && fr==br && fg==bg && fb==bb) continue;
				//if(fa!=255 && ba!=0) return false;
				if(fa<220 && ba>20) return false;
			}
		}
	return true;
}



UPNG.encode = function(bufs, w, h, ps, dels, forbidPlte)
{
	if(ps==null) ps=0;
	if(forbidPlte==null) forbidPlte = false;
	var data = new Uint8Array(bufs[0].byteLength*bufs.length+100);
	var wr=[0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];
	for(var i=0; i<8; i++) data[i]=wr[i];
	var offset = 8,  bin = UPNG._bin, crc = UPNG.crc.crc, wUi = bin.writeUint, wUs = bin.writeUshort, wAs = bin.writeASCII;

	var nimg = UPNG.encode.compressPNG(bufs, w, h, ps, forbidPlte);

	wUi(data,offset, 13);     offset+=4;
	wAs(data,offset,"IHDR");  offset+=4;
	wUi(data,offset,w);  offset+=4;
	wUi(data,offset,h);  offset+=4;
	data[offset] = nimg.depth;  offset++;  // depth
	data[offset] = nimg.ctype;  offset++;  // ctype
	data[offset] = 0;  offset++;  // compress
	data[offset] = 0;  offset++;  // filter
	data[offset] = 0;  offset++;  // interlace
	wUi(data,offset,crc(data,offset-17,17));  offset+=4; // crc

	// 9 bytes to say, that it is sRGB
	wUi(data,offset, 1);      offset+=4;
	wAs(data,offset,"sRGB");  offset+=4;
	data[offset] = 1;  offset++;
	wUi(data,offset,crc(data,offset-5,5));  offset+=4; // crc

	var anim = bufs.length>1;
	if(anim) {
		wUi(data,offset, 8);      offset+=4;
		wAs(data,offset,"acTL");  offset+=4;
		wUi(data,offset, bufs.length);      offset+=4;
		wUi(data,offset, 0);      offset+=4;
		wUi(data,offset,crc(data,offset-12,12));  offset+=4; // crc
	}

	if(nimg.ctype==3) {
		var dl = nimg.plte.length;
		wUi(data,offset, dl*3);  offset+=4;
		wAs(data,offset,"PLTE");  offset+=4;
		for(var i=0; i<dl; i++){
			var ti=i*3, c=nimg.plte[i], r=(c)&255, g=(c>>8)&255, b=(c>>16)&255;
			data[offset+ti+0]=r;  data[offset+ti+1]=g;  data[offset+ti+2]=b;
		}
		offset+=dl*3;
		wUi(data,offset,crc(data,offset-dl*3-4,dl*3+4));  offset+=4; // crc

		if(nimg.gotAlpha) {
			wUi(data,offset, dl);  offset+=4;
			wAs(data,offset,"tRNS");  offset+=4;
			for(var i=0; i<dl; i++)  data[offset+i]=(nimg.plte[i]>>24)&255;
			offset+=dl;
			wUi(data,offset,crc(data,offset-dl-4,dl+4));  offset+=4; // crc
		}
	}
	
	var fi = 0;
	for(var j=0; j<nimg.frames.length; j++)
	{
		var fr = nimg.frames[j];
		if(anim) {
			wUi(data,offset, 26);     offset+=4;
			wAs(data,offset,"fcTL");  offset+=4;
			wUi(data, offset, fi++);   offset+=4;
			wUi(data, offset, fr.rect.width );   offset+=4;
			wUi(data, offset, fr.rect.height);   offset+=4;
			wUi(data, offset, fr.rect.x);   offset+=4;
			wUi(data, offset, fr.rect.y);   offset+=4;
			wUs(data, offset, dels[j]);   offset+=2;
			wUs(data, offset,  1000);   offset+=2;
			data[offset] = fr.dispose;  offset++;	// dispose
			data[offset] = fr.blend  ;  offset++;	// blend
			wUi(data,offset,crc(data,offset-30,30));  offset+=4; // crc
		}
				
		var imgd = fr.cimg, dl = imgd.length;
		wUi(data,offset, dl+(j==0?0:4));     offset+=4;
		var ioff = offset;
		wAs(data,offset,(j==0)?"IDAT":"fdAT");  offset+=4;
		if(j!=0) {  wUi(data, offset, fi++);  offset+=4;  }
		for(var i=0; i<dl; i++) data[offset+i] = imgd[i];
		offset += dl;
		wUi(data,offset,crc(data,ioff,offset-ioff));  offset+=4; // crc
	}

	wUi(data,offset, 0);     offset+=4;
	wAs(data,offset,"IEND");  offset+=4;
	wUi(data,offset,crc(data,offset-4,4));  offset+=4; // crc

	return data.buffer.slice(0,offset);
}

UPNG.encode.compressPNG = function(bufs, w, h, ps, forbidPlte)
{
	var out = UPNG.encode.compress(bufs, w, h, ps, false, forbidPlte);
	for(var i=0; i<bufs.length; i++) {
		var frm = out.frames[i], nw=frm.rect.width, nh=frm.rect.height, bpl=frm.bpl, bpp=frm.bpp;

}

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#080b12;--surface:rgba(255,255,255,.045);--border:rgba(255,255,255,.09);
  --text:#e6e9f0;--muted:#6a7590;--brand:#1f3c88;--glow:#3a6fff;--accent:#5de0a5;

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--fb);overflow:hidden}
.layout{display:grid;grid-template-columns:1fr 410px;height:100vh}

.scene::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(ellipse 70% 50% at 50% 35%,rgba(255,248,235,.55) 0%,transparent 65%),
             radial-gradient(ellipse 50% 40% at 50% 85%,rgba(180,210,190,.25) 0%,transparent 70%)}
.snav{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:18px 24px;background:linear-gradient(to bottom,rgba(8,11,18,.9),transparent);z-index:10}
.back{display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--surface);
  border:1px solid var(--border);border-radius:999px;color:var(--muted);font-size:13px;
  font-family:var(--fb);cursor:pointer;text-decoration:none;transition:all .2s}
.back:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.stitle{font-family:var(--fh);font-size:22px;font-weight:300;letter-spacing:.03em}
.stitle em{color:var(--accent);font-style:italic}
.ast{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;
  align-items:center;gap:10px;padding:10px 20px;background:rgba(8,11,18,.88);

  color:#d7deef;backdrop-filter:blur(10px);z-index:10;transition:all .3s;white-space:nowrap}
.ast .dot{width:9px;height:9px;border-radius:50%;background:var(--muted);transition:all .3s;flex-shrink:0}
.ast.speaking .dot{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:dp .9s ease-in-out infinite}
.ast.speaking{color:var(--text)}
.ast.thinking .dot{background:#f0b429;box-shadow:0 0 8px #f0b429;animation:dp 1.4s ease-in-out infinite}
.ast.thinking{color:var(--text)}
@keyframes dp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
.lov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;background:var(--bg);z-index:20;transition:opacity .7s ease}
.lov.hidden{opacity:0;pointer-events:none}
.lr{width:46px;height:46px;border:1.5px solid var(--border);border-top-color:var(--glow);
  border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ll{font-family:var(--fh);font-size:17px;font-weight:300;letter-spacing:.08em;color:var(--muted)}
.ls{font-size:12px;color:rgba(255,255,255,.2);letter-spacing:.04em}

.ch{padding:20px 20px 14px;border-bottom:1px solid var(--border);flex-shrink:0}
.ch h2{font-family:var(--fh);font-size:20px;font-weight:400;margin-bottom:3px}
.ch p{font-size:12px;color:var(--muted)}
.sr{display:flex;align-items:center;gap:8px;margin-top:12px}
.sb{padding:7px 16px;border-radius:999px;border:1px solid var(--border);font-size:13px;

.sb.p{background:var(--brand);border-color:var(--brand);color:#fff}
.sb.p:hover{background:#2549a6}
.sb.s{color:var(--muted)}
.sb.s:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
.sb:disabled{opacity:.38;cursor:not-allowed}

.voice-btn svg{width:18px;height:18px;flex-shrink:0}
.voice-btn.on{background:rgba(93,224,165,.14);border-color:rgba(93,224,165,.45);color:#d8f5e8}
.voice-btn:hover{color:var(--text);border-color:rgba(255,255,255,.22)}

.mic:hover{background:rgba(255,255,255,.08)}.mic:active{transform:scale(.93)}.mic:disabled{opacity:.35;cursor:not-allowed}

.cmp textarea::placeholder{color:var(--muted)}
.cmp textarea:focus{border-color:rgba(58,111,255,.5)}
.cmp textarea:disabled{opacity:.35;cursor:not-allowed}

.hint{grid-column:1/-1;font-size:11px;color:var(--muted);margin-top:-4px}

const morphRefs={}, morphCur={};

function writeMorph(n,v){for(const{mesh,dict}of Object.values(morphRefs)){const i=dict[n];if(i!==undefined)mesh.morphTargetInfluences[i]=v;}}

/* =========================================================
   IDLE — blink + eye drift
========================================================= */
const idle={
  bT:0,bI:3.2+Math.random()*2,bP:'open',bt:0,dX:0,dY:0,dTX:0,dTY:0,dTim:0,
  update(dt){
    if(!morphRefs['Head_Mesh'])return;
    this.bT+=dt;
    if(this.bT>this.bI&&this.bP==='open'){this.bP='closing';this.bt=0;this.bT=0;this.bI=2.2+Math.random()*3.2;}
    if(this.bP==='closing'){this.bt+=dt/.07;const v=Math.min(this.bt,1);writeMorph('eyeBlinkLeft',v);writeMorph('eyeBlinkRight',v);if(v>=1){this.bP='opening';this.bt=0;}}
    if(this.bP==='opening'){this.bt+=dt/.12;const v=1-Math.min(this.bt,1);writeMorph('eyeBlinkLeft',v);writeMorph('eyeBlinkRight',v);if(v<=0)this.bP='open';}
    this.dTim-=dt;
    if(this.dTim<=0){this.dTim=1.6+Math.random()*2.8;this.dTX=(Math.random()-.5)*.22;this.dTY=(Math.random()-.5)*.12;}
    const s=5*dt;this.dX+=(this.dTX-this.dX)*s;this.dY+=(this.dTY-this.dY)*s;
    writeMorph('eyeLookInLeft',Math.max(0,this.dX));writeMorph('eyeLookInRight',Math.max(0,this.dX));
    writeMorph('eyeLookOutLeft',Math.max(0,-this.dX));writeMorph('eyeLookOutRight',Math.max(0,-this.dX));
    writeMorph('eyeLookUpLeft',Math.max(0,this.dY));writeMorph('eyeLookUpRight',Math.max(0,this.dY));
    writeMorph('eyeLookDownLeft',Math.max(0,-this.dY));writeMorph('eyeLookDownRight',Math.max(0,-this.dY));
  }
};

/* =========================================================
   VISEME LIPSYNC
========================================================= */
const ALL_V=['sil','PP','FF','TH','DD','kk','CH','SS','nn','RR','aa','E','I','O','U'];
const L2V={a:'aa',b:'PP',c:'kk',d:'DD',e:'E',f:'FF',g:'kk',h:'nn',i:'I',j:'CH',k:'kk',l:'nn',m:'PP',n:'nn',o:'O',p:'PP',q:'kk',r:'RR',s:'SS',t:'DD',u:'U',v:'FF',w:'U',x:'kk',y:'I',z:'SS'};
const V_OPEN={sil:.00,PP:.00,FF:.05,TH:.10,DD:.25,kk:.28,CH:.18,SS:.06,nn:.20,RR:.24,aa:.65,E:.38,I:.22,O:.55,U:.15};
const VISEME_STRENGTH=.85;
const MOUTH_SCALE=.72;
const JAW_SCALE=.28;
function charDur(ch){
  if('aeiou'.includes(ch))return .082;
  if('y'.includes(ch))return .074;
  if('fsvzhx'.includes(ch))return .066;
  if('bmp'.includes(ch))return .054;
  if('cdgkqtw'.includes(ch))return .058;
  return .062;
}
function buildTL(text,totalDuration=0){
  const tl=[];let t=0;
  for(let i=0;i<text.length;i++){
    const raw=text[i],ch=raw.toLowerCase();
    if(/\s/.test(raw)){tl.push({v:'sil',s:t,d:.05,i});t+=.05;continue;}
    if(/[.,!?;:]/.test(raw)){tl.push({v:'sil',s:t,d:.07,i});t+=.07;continue;}
    if(!/[a-z]/.test(ch))continue;
    const d=charDur(ch);
    tl.push({v:L2V[ch]||'sil',s:t,d,i});
    t+=d;
  }
  const out=tl.length?tl:[{v:'sil',s:0,d:.08,i:0}];
  if(totalDuration>0){
    const last=out.at(-1),srcDuration=last?last.s+last.d:.08,targetDuration=Math.max(.18,totalDuration-.04),scale=srcDuration>0?targetDuration/srcDuration:1;
    return out.map(ev=>({...ev,s:ev.s*scale,d:ev.d*scale}));
  }
  return out;
}
const audioState={ctx:null,analyser:null,data:null,src:null,active:false,
  async prime(){
    const Ctx=window.AudioContext||window.webkitAudioContext;
    if(!Ctx)throw new Error('Web Audio is not supported in this browser.');
    if(!this.ctx){
      this.ctx=new Ctx();
      this.analyser=this.ctx.createAnalyser();
      this.analyser.fftSize=1024;
      this.analyser.smoothingTimeConstant=.72;
      this.data=new Uint8Array(this.analyser.frequencyBinCount);
      this.analyser.connect(this.ctx.destination);
    }
    if(this.ctx.state==='suspended')await this.ctx.resume();
    return this.ctx;
  },
  stop(){
    if(this.src){
      this.src.onended=null;
      try{this.src.stop();}catch{}
      try{this.src.disconnect();}catch{}
      this.src=null;
    }
    this.active=false;
  },
  async playAudio(arrayBuffer,{onstart,onended}={}){
    const ctx=await this.prime();
    this.stop();
    const decoded=await ctx.decodeAudioData(arrayBuffer.slice(0));
    const src=ctx.createBufferSource();
    src.buffer=decoded;
    src.connect(this.analyser);
    src.onended=()=>{
      if(this.src!==src)return;
      this.src=null;
      this.active=false;
      if(onended)onended();
    };
    this.src=src;
    this.active=true;
    if(onstart)onstart(decoded.duration);
    src.start(0);
    return decoded.duration;
  },
  getLevels(){
    if(!this.active||!this.analyser||!this.data)return{energy:0,brightness:0};
    this.analyser.getByteFrequencyData(this.data);
    const avg=(start,end)=>{
      let total=0,count=0;
      for(let i=start;i<Math.min(end,this.data.length);i++){total+=this.data[i];count++;}
      return count?total/(count*255):0;
    };
    const low=avg(0,14),mid=avg(14,56),high=avg(56,160);
    return{
      energy:Math.min(1,low*.55+mid*.95+high*.35),
      brightness:Math.min(1,high*1.35)
    };
  }
};
const lipsync={active:false,tl:[],t0:0,energy:0,brightness:0,
  play(tx,totalDuration=0){this.tl=buildTL(tx,totalDuration);this.t0=performance.now()/1000;this.active=true;},
  stop(){this.active=false;this.tl=[];},
  elapsed(now=performance.now()/1000){return now-this.t0;},
  update(dt){
    let cur='sil';
    if(this.active){
      const e=this.elapsed(),last=this.tl.at(-1);
      if(last&&e>last.s+last.d+.24&&!audioState.active)this.stop();
      else for(const ev of this.tl)if(e>=ev.s&&e<ev.s+ev.d){cur=ev.v;break;}
    }
    const levels=audioState.getLevels();
    const targetEnergy=this.active?Math.min(1,levels.energy*1.7):0;
    const targetBrightness=this.active?levels.brightness:0;
    this.energy+=(targetEnergy-this.energy)*Math.min(1,10*dt);
    this.brightness+=(targetBrightness-this.brightness)*Math.min(1,8*dt);
    const articulation=Math.max(0,this.energy-.03);
    const visemeAmount=this.active?VISEME_STRENGTH*(.6+articulation*.4):0;
    const open=this.active?(V_OPEN[cur]??0)*MOUTH_SCALE*(.62+articulation*.38):0;
    const sp=14*dt;
    for(const k of ALL_V)lerpMorph('viseme_'+k,this.active&&k===cur?visemeAmount:0,sp);
    lerpMorph('mouthOpen',open,sp);
    lerpMorph('jawOpen',open*JAW_SCALE/MOUTH_SCALE,sp);
    lerpMorph('mouthSmileLeft',this.active?this.brightness*.05:0,sp);
    lerpMorph('mouthSmileRight',this.active?this.brightness*.05:0,sp);
  }
};
function unlockCtx(){
  const Ctx=window.AudioContext||window.webkitAudioContext;
  if(!Ctx)return;
  if(!audioState.ctx){
    try{
      audioState.ctx=new Ctx();
      audioState.analyser=audioState.ctx.createAnalyser();
      audioState.analyser.fftSize=1024;
      audioState.analyser.smoothingTimeConstant=.72;
      audioState.data=new Uint8Array(audioState.analyser.frequencyBinCount);

    }catch{return;}
  }
  if(audioState.ctx.state!=='running')audioState.ctx.resume().catch(()=>{});
  try{
    const s=audioState.ctx.createBufferSource();
    s.buffer=audioState.ctx.createBuffer(1,1,22050);

/* =========================================================
   IMAGE DECODER
   window.jpegDecode  — from inline jpeg-js (sets module.exports = decode function)
   window.UPNG        — from inline UPNG.js  (uses window.pako automatically)
   window.pako        — from inline pako UMD

   decodeToCanvas: raw bytes + mime -> HTMLCanvasElement via putImageData
   No img.src, no fetch, no URL.createObjectURL.
========================================================= */
function decodeToCanvas(bytes, mime){
  const cvs=document.createElement('canvas');
  const ctx=cvs.getContext('2d');
  let w,h,rgba;
  if(mime==='image/png'){
    // UPNG.decode needs its own ArrayBuffer (no shared memory)
    const dec=window.UPNG.decode(bytes.slice().buffer);
    w=dec.width; h=dec.height;
    rgba=new Uint8ClampedArray(window.UPNG.toRGBA8(dec)[0]);
  } else {
    // jpeg-js: window.jpegDecode IS the decode function directly
    const dec=window.jpegDecode(bytes,{useTArray:true});
    w=dec.width; h=dec.height;
    rgba=new Uint8ClampedArray(dec.data.buffer);
  }
  cvs.width=w; cvs.height=h;
  ctx.putImageData(new ImageData(rgba,w,h),0,0);
  return cvs;
}

/* =========================================================
   GLB PREP + ImageLoader patch
========================================================= */
const imageMap=new Map();

function patchImageLoader(){
  const orig=THREE.ImageLoader.prototype.load;
  THREE.ImageLoader.prototype.load=function(url,onLoad,onProgress,onError){
    for(const[key,cvs]of imageMap){if(url===key){if(onLoad)setTimeout(()=>onLoad(cvs),0);return cvs;}}
    return orig.call(this,url,onLoad,onProgress,onError);
  };
}
function unpatchImageLoader(){imageMap.clear();}

async function prepareGLB(ab){
  const sub=document.getElementById('lsub');
  const view=new DataView(ab);
  const jLen=view.getUint32(12,true);
  const gltf=JSON.parse(new TextDecoder().decode(new Uint8Array(ab,20,jLen)));
  const bStart=20+jLen;
  const bLen=view.getUint32(bStart,true);
  const bin=new Uint8Array(ab,bStart+8,bLen);

  const images=gltf.images||[];
  for(let i=0;i<images.length;i++){
    const imgDef=images[i];
    if(imgDef.bufferView===undefined)continue;
    const bv=gltf.bufferViews[imgDef.bufferView];
    const bytes=bin.slice(bv.byteOffset,bv.byteOffset+bv.byteLength);
    const mime=(bytes[0]===0x89&&bytes[1]===0x50)?'image/png':(imgDef.mimeType||'image/jpeg');
    const key='IMG_'+i;
    sub.textContent='Decoding texture '+(i+1)+' / '+images.length+'…';
    await new Promise(r=>setTimeout(r,0));
    try{imageMap.set(key,decodeToCanvas(bytes,mime));imgDef.uri=key;delete imgDef.bufferView;delete imgDef.mimeType;}
    catch(e){console.warn('Texture '+i+' failed:',e.message);}
  }

  if(gltf.buffers&&gltf.buffers[0]&&!gltf.buffers[0].uri){
    sub.textContent='Caching geometry…';
    const key='BUF_0';
    const copy=new Uint8Array(bLen); copy.set(bin);
    THREE.Cache.add(key,copy.buffer);
    gltf.buffers[0].uri=key;
  }
  return JSON.stringify(gltf);
}

/* =========================================================
   LOAD SEQUENCE
========================================================= */
THREE.Cache.enabled=true;

function b64ToAB(b64){const bin=atob(b64),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);return buf.buffer;}

function frameCameraOnFace(root){
  const bodyBox=new THREE.Box3().setFromObject(root);
  const h=bodyBox.max.y-bodyBox.min.y;
  const lookRatio=CAMERA_PRESET.lookHeight??0.895;
  const target=new THREE.Vector3(0,bodyBox.min.y+h*lookRatio,0);
  const dist=CAMERA_PRESET.faceDistance||0.95;
  camera.position.set(target.x,target.y+(CAMERA_PRESET.eyeOffset||0),target.z+dist);
  controls.target.copy(target);
  controls.update();
}

function finalizeLoadedModel(root, animations){
  const box=new THREE.Box3().setFromObject(root);
  const height=box.max.y-box.min.y;
  if(height>0)root.scale.setScalar(CAMERA_PRESET.scale/height);
  box.setFromObject(root); root.position.y=-box.min.y;
  root.traverse(child=>{
    if(!child.isMesh)return;
    child.castShadow=true; child.receiveShadow=true;
    if(child.morphTargetDictionary&&Object.keys(child.morphTargetDictionary).length)
      morphRefs[child.name]={mesh:child,dict:child.morphTargetDictionary};
  });
  scene.add(root);
  frameCameraOnFace(root);
  const clips=animations||[];
  if(clips.length){
    mixer=new THREE.AnimationMixer(root);
    const act=mixer.clipAction(clips[0]);
    act.setLoop(THREE.LoopRepeat,Infinity); act.play();
  }
  document.getElementById('lov').classList.add('hidden');
  setSt('idle',HOST_KEY==='home-dock'?'Listening…':'Ready — start a session');
  if(window.ReactNativeWebView){
    window.ReactNativeWebView.postMessage(JSON.stringify({type:'avatar-model-ready',host:HOST_KEY}));
  }
}

(async function loadModel(){
  const sub=document.getElementById('lsub');
  if(!MODEL_URL){
    sub.textContent='Missing model URL';
    return;
  }
  try{
    sub.textContent='Loading model…';
    await new Promise(r=>setTimeout(r,30));
    const response=await fetch(MODEL_URL);
    if(!response.ok)throw new Error('HTTP '+response.status+' '+response.statusText);
    const total=Number(response.headers.get('content-length'))||0;
    let buffer;
    if(response.body&&total){
      const reader=response.body.getReader();
      const chunks=[];
      let loaded=0;
      while(true){
        const {done,value}=await reader.read();
        if(done)break;
        chunks.push(value);
        loaded+=value.byteLength;
        sub.textContent='Loading model… '+Math.round((loaded/total)*100)+'%';
      }
      const merged=new Uint8Array(loaded);
      let offset=0;
      for(const chunk of chunks){merged.set(chunk,offset);offset+=chunk.byteLength;}
      buffer=merged.buffer;
    }else{
      buffer=await response.arrayBuffer();
      if(total)sub.textContent='Loading model… 100%';
    }
    sub.textContent='Building scene…';
    const heartbeat=setInterval(()=>{sub.textContent='Building scene… still working';},4000);
    await new Promise(r=>setTimeout(r,50));
    try{
      await MeshoptDecoder.ready;
      const loader=new GLTFLoader();
      loader.setMeshoptDecoder(MeshoptDecoder);
      loader.parse(buffer,'',(gltf)=>{
        clearInterval(heartbeat);
        finalizeLoadedModel(gltf.scene, gltf.animations);
      },(err)=>{
        clearInterval(heartbeat);
        sub.textContent='Parse error: '+(err?.message||err);
        console.error(err);
      });
    }catch(err){
      clearInterval(heartbeat);
      sub.textContent='Parse error: '+(err?.message||err);
      console.error(err);
    }
  }catch(err){sub.textContent='Load error: '+(err?.message||err);console.error(err);}
})();

/* =========================================================
   TTS
========================================================= */
const ttschk=document.getElementById('ttschk');
const TTS_VOICE=queryParams.get('tts_voice')||'en-US-JennyNeural';
const TTS_PROVIDER=queryParams.get('tts_provider')||'edge';
const REMOTE_SERVER='https://multilingual-virtual-assistant.onrender.com';
const LOCAL_SERVER='http://127.0.0.1:8000';
function getCurrentOriginServer(){
  if(window.location.protocol==='http:'||window.location.protocol==='https:'){
    return window.location.origin;
  }
  return '';
}
function isUnreachableLanBase(base){
  if(!base)return false;
  return /^https?:\/\/(192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.|localhost|127\.)/i.test(base);
}
function buildTtsCandidates(){
  const isMobile=!!window.ReactNativeWebView;
  const bases=[];
  if(TTS_BASE_URL&&!isUnreachableLanBase(TTS_BASE_URL))bases.push(TTS_BASE_URL);
  bases.push(REMOTE_SERVER);
  if(!isMobile){
    bases.push(LOCAL_SERVER);
    const origin=getCurrentOriginServer();
    if(origin)bases.push(origin);
  }
  return [...new Set(bases.filter(Boolean))];
}
const TTS_SERVER_CANDIDATES=buildTtsCandidates();
const SERVER_CANDIDATES=[getCurrentOriginServer(),LOCAL_SERVER,REMOTE_SERVER].filter(Boolean);
async function fetchFromCandidates(path, options={}, preferredBases=SERVER_CANDIDATES, timeoutMs=8000){
  let lastError=null;
  for(const base of [...new Set(preferredBases)]){
    const controller=new AbortController();
    const timer=setTimeout(()=>controller.abort(),timeoutMs);
    try{
      const response=await fetch(base+path,{...options,signal:controller.signal});
      clearTimeout(timer);
      if(!response.ok)throw new Error(`${base}${path} -> HTTP ${response.status}`);
      return response;
    }catch(error){
      clearTimeout(timer);
      lastError=error;
    }
  }
  throw lastError||new Error(`Request failed for ${path}`);
}
const ttsCache=new Map();
async function fetchTtsBuffer(text){
  const key=(text||'').trim();
  if(!key)throw new Error('Missing text for TTS');
  if(ttsCache.has(key)){
    const hit=ttsCache.get(key);
    return hit instanceof Promise?await hit:hit;
  }
  const job=apiTts(key).then((buf)=>{
    ttsCache.set(key,buf);
    return buf;
  }).catch((err)=>{
    ttsCache.delete(key);
    throw err;
  });
  ttsCache.set(key,job);
  return job;
}
function prefetchTts(text){
  const key=(text||'').trim();
  if(!key||ttsCache.has(key))return;
  fetchTtsBuffer(key).catch(()=>{});
}
let speechToken=0;
let ttsRequestCounter=0;
const pendingTtsRequests=new Map();
window._onNativeTtsAudio=async function(payload){
  const id=payload&&payload.id;
  const base64=payload&&payload.base64;
  const uri=payload&&payload.uri;
  const pending=id?pendingTtsRequests.get(id):null;
  if(!pending)return;
  pendingTtsRequests.delete(id);
  if(base64){
    try{
      const binary=atob(base64);
      const bytes=new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
      pending.resolve(bytes.buffer);
      return;
    }catch(error){
      pending.reject(error);
      return;
    }
  }
  if(!uri){pending.reject(new Error('Native TTS failed'));return;}
  try{
    const response=await fetch(uri);
    if(!response.ok)throw new Error(`TTS file HTTP ${response.status}`);
    pending.resolve(await response.arrayBuffer());
  }catch(error){
    pending.reject(error);
  }
};
function apiTtsViaNative(text){
  return new Promise((resolve,reject)=>{
    const id=`tts-${++ttsRequestCounter}-${Date.now()}`;
    pendingTtsRequests.set(id,{resolve,reject});
    window.ReactNativeWebView.postMessage(JSON.stringify({
      type:'tts-fetch',
      id,
      text,
      host:HOST_KEY
    }));
    setTimeout(()=>{
      if(!pendingTtsRequests.has(id))return;
      pendingTtsRequests.delete(id);
      reject(new Error('Native TTS timeout'));
    },45000);
  });
}
async function apiTts(text){
  if(window.ReactNativeWebView)return apiTtsViaNative(text);
  const r=await fetchFromCandidates('/tts',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text,voice_name:TTS_VOICE,provider:TTS_PROVIDER})
  },TTS_SERVER_CANDIDATES,12000);
  return await r.arrayBuffer();
}
function speakWithNativeFallback(trimmed,token){
  if(GUIDED_MODE||!window.ReactNativeWebView)return false;
  setSt('speaking','Speaking…');
  lipsync.play(trimmed,estimateSpeechDuration(trimmed));
  window.ReactNativeWebView.postMessage(JSON.stringify({type:'native-speak',text:trimmed}));
  return true;
}
function stopSpeech(status='Listening…'){
  speechToken+=1;
  audioState.stop();
  lipsync.stop();
  if('speechSynthesis' in window)speechSynthesis.cancel();
  if(window.ReactNativeWebView)window.ReactNativeWebView.postMessage(JSON.stringify({type:'native-stop-speech'}));
  setSt('idle',status);
}
function estimateSpeechDuration(text){
  const words=text.trim().split(/\s+/).filter(Boolean).length;
  return Math.max(1.8,words*0.42);
}
window.onNativeSpeakDone=function(){
  lipsync.stop();
  setSt('idle',GUIDED_MODE?'Ready for next part':'Listening…');
};
async function speak(text){
  const trimmed=text.trim();
  if(!trimmed)return;
  speechToken+=1;
  const token=speechToken;
  audioState.stop();
  lipsync.stop();
  if(!ttschk.checked){setSt('idle','Listening…');return;}
  try{
    const cached=ttsCache.get(trimmed);
    const ready=cached&&!(cached instanceof Promise);
    setSt(ready?'speaking':'thinking',ready?'Speaking…':'Getting ready to speak…');
    await audioState.prime().catch(()=>{});
    const audioBuffer=await fetchTtsBuffer(trimmed);
    if(token!==speechToken)return;
    await audioState.playAudio(audioBuffer,{
      onstart:(duration)=>{
        if(token!==speechToken){audioState.stop();return;}
        lipsync.play(trimmed,duration);
        setSt('speaking','Speaking…');
      },
      onended:()=>{
        if(token!==speechToken)return;
        lipsync.stop();
        setSt('idle',GUIDED_MODE?'Ready for next part':'Listening…');
        if(window.ReactNativeWebView){
          window.ReactNativeWebView.postMessage(JSON.stringify({type:'native-speak-done'}));
        }
      }
    });
  }catch(err){
    if(token!==speechToken)return;
    ttsCache.delete(trimmed);
    audioState.stop();
    lipsync.stop();
    if(speakWithNativeFallback(trimmed,token))return;
    setSt('idle','Voice unavailable. Try again.');
    console.error('TTS failed:',err);
  }
}

/* =========================================================
   GEMINI CHAT
========================================================= */
let sid=SHARED_CHAT_ID||null;
let messageLog=[];
function getTranscriptStorageKey(){return sid?`mindfulness-avatar-transcript:${sid}`:'';}
function shouldKeepStoredMessage(entry){
  const text=(entry&&entry.text)||'';
  if(!text)return true;
  if(text.includes('session started. Your mindfulness guide is here.'))return false;
  if(text.includes('This session ended before any messages were sent.'))return false;
  if(text.includes('Could not connect to the mindfulness server right now.'))return false;
  if(text.startsWith('Session summary:'))return false;
  return true;
}
function persistTranscript(){
  const key=getTranscriptStorageKey();
  if(!key)return;
  try{localStorage.setItem(key,JSON.stringify(messageLog));}catch{}
}
function renderTranscript(){
  msgsEl.innerHTML='';
  for(const entry of messageLog){
    const d=document.createElement('div');
    d.className='msg '+entry.role;
    d.textContent=entry.text;
    msgsEl.appendChild(d);
  }
  msgsEl.scrollTop=msgsEl.scrollHeight;
}
function restoreTranscript(){
  const key=getTranscriptStorageKey();
  if(!key)return false;
  try{
    const raw=localStorage.getItem(key);
    const parsed=raw?JSON.parse(raw):[];
    if(!Array.isArray(parsed))return false;
    messageLog=parsed.filter(shouldKeepStoredMessage);
    persistTranscript();
    renderTranscript();
    return messageLog.length>0;
  }catch{
    return false;
  }
}
async function apiChat(msg){const r=await fetchFromCandidates('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,session_id:sid})});return(await r.json()).reply;}
async function apiEnd(){if(!sid)return null;try{const r=await fetchFromCandidates('/session/end',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})});return(await r.json()).summary;}catch{return null;}}

async function* streamChat(prompt){
  const res=await fetchFromCandidates('/chat/stream',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({message:prompt,session_id:sid}),
  });
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf='';
  while(true){
    const{value,done}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    const parts=buf.split('\n\n');
    buf=parts.pop();
    for(const part of parts){
      if(!part.startsWith('data: '))continue;
      const evt=JSON.parse(part.slice(6));
      if(evt.error)throw new Error(evt.error);
      if(evt.done)return;
      if(evt.chunk)yield evt.chunk;
    }
  }
}

async function replyWithStream(prompt){
  speechToken++;
  const myToken=speechToken;
  audioState.stop();lipsync.stop();
  await audioState.prime().catch(()=>{});
  let msgDiv=null,fullText='';

  function appendChunk(chunk){
    fullText+=(fullText?' ':'')+chunk;
    if(!msgDiv){msgDiv=document.createElement('div');msgDiv.className='msg assistant';msgsEl.appendChild(msgDiv);}
    msgDiv.textContent=fullText;
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  try{
    let gotChunk=false;
    try{
      for await(const chunk of streamChat(prompt)){
        gotChunk=true;
        if(speechToken!==myToken)return;
        setTyp(false);
        appendChunk(chunk);
        setSt('thinking','Typing…');
      }
    }catch(streamErr){
      if(gotChunk)throw streamErr;
      const r=await apiChat(prompt);
      if(speechToken!==myToken)return;
      setTyp(false);
      appendChunk(r);
    }
    if(fullText){messageLog.push({role:'assistant',text:fullText});persistTranscript();}
    if(speechToken===myToken)await speak(fullText);
  }catch{
    setTyp(false);setSt('idle','Listening…');
    addMsg('system','Could not connect to the mindfulness server right now.');
  }
}

/* =========================================================
   UI
========================================================= */
const msgsEl=document.getElementById('msgs'),typEl=document.getElementById('typ'),inp=document.getElementById('inp'),bstart=document.getElementById('bstart'),bend=document.getElementById('bend'),bsend=document.getElementById('bsend');
function createSessionId(){return window.crypto&&typeof window.crypto.randomUUID==='function'?window.crypto.randomUUID():'session-'+Date.now()+'-'+Math.random().toString(16).slice(2);}
function setSt(state,text){document.getElementById('ast').className='ast'+(state!=='idle'?' '+state:'');document.getElementById('stxt').textContent=text;}
function addMsg(role,text){messageLog.push({role,text});persistTranscript();const d=document.createElement('div');d.className='msg '+role;d.textContent=text;msgsEl.appendChild(d);msgsEl.scrollTop=msgsEl.scrollHeight;}
function setTyp(on){typEl.classList.toggle('on',on);if(on)msgsEl.scrollTop=msgsEl.scrollHeight;}
function setUi(active){inp.disabled=!active;bsend.disabled=!active;bmic.disabled=!active;bend.disabled=!active;bstart.disabled=active;inp.placeholder=active?'Type or tap the mic to speak…':getInactivePlaceholder();}

function getScriptedWelcomeText(){
  if(HOST_KEY==='home-dock'){
    return "Hello. I'm your mindfulness assistant, and I'm here to help. How are you doing today?";
  }
  return `Welcome to your ${SESSION_NAME} session. Find a comfortable position, and we'll begin when you're ready.`;
}

async function startAvatarSession(options={}){
  const { promptOverride=null, announce=true } = options;
  const hasTranscript=messageLog.length>0;
  if(!sid)sid=SHARED_CHAT_ID||createSessionId();
  if(!GUIDED_MODE)setUi(true);
  if(!GUIDED_MODE&&!hasTranscript&&announce)addMsg('system',`${SESSION_NAME} session started. Your mindfulness guide is here.`);

  const scriptedLine=
    (HOST_KEY==='home-dock'&&!promptOverride)?getScriptedWelcomeText():
    (typeof promptOverride==='string'&&promptOverride.trim()&&!/^(you are|reply with|app context)/i.test(promptOverride.trim()))?promptOverride.trim():
    null;
  if(scriptedLine){
    setTyp(false);
    await speakScriptLine(scriptedLine);
    return;
  }

  if(GUIDED_MODE){
    setSt('idle','Press Start session to begin.');
    return;
  }

  setSt('thinking',HOST_KEY==='home-dock'?'Getting ready…':'Thinking…');inp.focus();setTyp(true);
  const prompt=promptOverride||getInitialWelcomePrompt();
  await replyWithStream(prompt);
}

// Speak a preloaded script line straight through TTS — no LLM round-trip.
async function speakScriptLine(text){
  const trimmed=(text||'').trim();
  if(!trimmed)return;
  if(!sid)sid=SHARED_CHAT_ID||createSessionId();
  if(!GUIDED_MODE)setUi(true);
  setTyp(false);
  if(!GUIDED_MODE)addMsg('assistant',trimmed);
  await speak(trimmed);
}
bstart.addEventListener('click',startAvatarSession);
bend.addEventListener('click',async()=>{
  stopSpeech('Session ended');setTyp(true);
  const s=await apiEnd();setTyp(false);sid=null;setUi(false);
  addMsg('system',s?'Session summary:\n'+s:'Session ended. Take care.');
});
async function handleSend(){
  if(GUIDED_MODE)return;
  const text=inp.value.trim();if(!text||!sid)return;
  inp.value='';addMsg('user',text);inp.disabled=true;bsend.disabled=true;bmic.disabled=true;setTyp(true);setSt('thinking','Thinking…');
  await replyWithStream(text);
  inp.disabled=false;bsend.disabled=false;bmic.disabled=false;inp.focus();
}

async function hostEndSession(){
  stopSpeech('Session ended');
  setTyp(false);
  if(GUIDED_MODE){
    setSt('idle','Session ended');
    return;
  }
  if(!sid){
    setUi(Boolean(messageLog.length||HOST_KEY==='home-dock'));
    setSt('idle','Listening…');
    return;
  }
  setUi(true);
  setSt('idle','Listening…');
  addMsg('system','Session concluded. You can keep chatting with your mindfulness assistant.');
}

function hostPauseSession(){
  stopSpeech('Listening…');
  setTyp(false);
  setUi(Boolean(messageLog.length||HOST_KEY==='home-dock'));
  setSt('idle','Listening…');
}

window.addEventListener('message',event=>{
  if(event.origin!==window.location.origin)return;
  const data=event.data;
  if(!data||data.source!=='mindfulness-host')return;

  if(data.type==='host-start-session'){
    startAvatarSession({promptOverride:data.prompt||null,announce:data.announce!==false});
    return;
  }

  if(data.type==='host-send-text'){
    if(GUIDED_MODE)return;
    if(!sid&&data.text){
      startAvatarSession({promptOverride:data.text,announce:false});
      return;
    }
    inp.value=data.text||'';
    handleSend();
    return;
  }

  if(data.type==='host-speak-script'){
    speakScriptLine(data.text||'');
    return;
  }

  if(data.type==='host-prefetch-tts'){
    (data.texts||[]).forEach(prefetchTts);
    return;
  }

  if(data.type==='host-end-session'){
    hostEndSession();
    return;
  }

  if(data.type==='host-pause-session'){
    hostPauseSession();
  }
});

/* Direct hook for React Native injectJavaScript — bypasses the origin check
   that blocks postMessage from file:// WebViews on iOS/Android. */
window._nativeHostCommand=function(cmd){
  if(!cmd||cmd.source!=='mindfulness-host')return;
  if(cmd.type==='host-start-session'){startAvatarSession({promptOverride:cmd.prompt||null,announce:cmd.announce!==false});return;}
  if(cmd.type==='host-send-text'){if(GUIDED_MODE)return;if(!sid&&cmd.text){startAvatarSession({promptOverride:cmd.text,announce:false});return;}inp.value=cmd.text||'';handleSend();return;}
  if(cmd.type==='host-speak-script'){speakScriptLine(cmd.text||'');return;}
  if(cmd.type==='host-prefetch-tts'){(cmd.texts||[]).forEach(prefetchTts);return;}
  if(cmd.type==='host-end-session'){hostEndSession();return;}
  if(cmd.type==='host-pause-session'){hostPauseSession();}
};

bsend.addEventListener('click',()=>{unlockCtx();handleSend();});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();unlockCtx();handleSend();}});
const voiceBtn=document.getElementById('voiceBtn');
function syncVoiceBtn(){
  const on=ttschk.checked;
  voiceBtn.classList.toggle('on',on);
  voiceBtn.setAttribute('aria-pressed',String(on));
  const lbl=GUIDED_MODE?(on?'Sound: ON':'Sound: OFF'):(on?'Voice on':'Voice off');
  voiceBtn.setAttribute('aria-label',lbl);
  document.getElementById('voiceLbl').textContent=lbl;
}
voiceBtn.addEventListener('click',()=>{
  unlockCtx();
  ttschk.checked=!ttschk.checked;
  syncVoiceBtn();
  if(ttschk.checked)audioState.prime().catch(()=>{});
  else stopSpeech('Voice off');
});
syncVoiceBtn();
function onHostTtsMessage(event){
  try{
    const raw=event&&event.data;
    if(!raw||typeof raw!=='string')return;
    const data=JSON.parse(raw);
    if(data.type==='tts-audio')window._onNativeTtsAudio({id:data.id,base64:data.base64});
  }catch(e){}
}
if(window.ReactNativeWebView){
  document.addEventListener('message',onHostTtsMessage);
  window.addEventListener('message',onHostTtsMessage);
}
const bmic=document.getElementById('bmic');
bmic.addEventListener('click',()=>{
  unlockCtx();
  if(window.ReactNativeWebView){
    window.ReactNativeWebView.postMessage(JSON.stringify({type:'native-dictate-hint'}));
  }
  if(!inp.disabled){
    inp.focus();
    inp.placeholder='Tap the keyboard microphone to speak…';
  }
});
ttschk.addEventListener('change',()=>{unlockCtx();syncVoiceBtn();if(ttschk.checked)audioState.prime().catch(()=>{});else stopSpeech('Voice off');});
if(GUIDED_MODE){
  const sceneEl=document.querySelector('.scene');
  const voiceRow=document.querySelector('.tr');
  if(sceneEl&&voiceRow){
    voiceRow.classList.add('scene-voice');
    sceneEl.appendChild(voiceRow);
  }
}
const hasStoredTranscript=!GUIDED_MODE&&restoreTranscript();
if(hasStoredTranscript){
  setUi(true);
  setSt('idle','Listening…');
}
window.addEventListener('load',()=>{postHostMessage({type:'avatar-ready'});},{once:true});
</script>
