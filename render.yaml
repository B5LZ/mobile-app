services:
  - type: web
    name: multilingual-virtual-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 server.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: GOOGLE_API_KEY
        sync: false
      - key: EXPO_PUBLIC_FIREBASE_API_KEY
        sync: false
      - key: GEMINI_TTS_MODEL
        value: gemini-3.1-flash-tts-preview
      - key: GEMINI_TTS_VOICE
        value: Iapetus
      - key: ALLOWED_ORIGINS
        value: https://multilingual-virtual-assistant.onrender.com
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: eastus
      - key: TTS_PROVIDER
        value: azure
